<!DOCTYPE html>
<html>
  <head>
    <style>
      .exp-image { width: 500px; height: 400px; object-fit: contain; border: 2px solid #ccc; display: block; margin: 0 auto; }
      .stimulus-container { width: 600px; margin: 0 auto; text-align: center; }
      .question-area { height: 120px; display: flex; align-items: center; justify-content: center; }
      .small-image { width: 350px; height: 280px; object-fit: contain; border: 2px solid #ccc; }
      .transition-square { 
          width: 250px; height: 250px; margin: 0 auto; 
          display: flex; align-items: center; justify-content: center;
          font-family: Arial; font-size: 32px; font-weight: bold; border-radius: 15px;
      }
      .bg-story { background-color: #ffcccb; color: #8b0000; } 
      .bg-info { background-color: #add8e6; color: #00008b; }  
      .value-tag { font-size: 32px; font-weight: bold; margin-top: 20px; font-family: Arial; }
      .val-high { color: green; }
      .val-low { color: gray; }
      .instruction-text { font-family: Arial; text-align: left; padding: 50px; line-height: 1.6; font-size: 18px; }
    </style>
    <title>Story vs Facts Experiment</title>
    <script src="jspsych/plugins/jspsych.js"></script>
    <script src="jspsych/plugins/plugin-instructions.js"></script>
    <script src="jspsych/plugins/plugin-html-button-response.js"></script>
    <script src="jspsych/plugins/plugin-survey-text.js"></script>
    <script src="jspsych/plugins/plugin-html-keyboard-response.js"></script>
    <script src="jspsych/plugins/plugin-fullscreen.js"></script>
    <script src="jspsych/plugins/plugin-preload.js"></script>
    <link rel="stylesheet" href="jspsych/css/jspsych.css">
  </head>
  <body></body>
  <script>

var jsPsych = initJsPsych({
    on_finish: function() {
        saveData(jsPsych.data.get().csv());
    }
});

function saveData(data) {
    fetch('write_data.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filedata: data })
    })
    .catch(error => console.error("Error saving data:", error));
}

var timeline = [];

// --- הגדרת סדרות (8 סדרות סה"כ - מאוחד) ---
var all_numbers = [1, 2, 3, 4, 5, 6, 7, 8];
var shuffled_numbers = jsPsych.randomization.shuffle(all_numbers);

var all_blocks = [
    // 4 סדרות סיפור (2 יקרות, 2 זולות)
    { name: 'story_' + shuffled_numbers[0], type: 'story', is_valuable: true }, 
    { name: 'story_' + shuffled_numbers[1], type: 'story', is_valuable: true },
    { name: 'story_' + shuffled_numbers[2], type: 'story', is_valuable: false },
    { name: 'story_' + shuffled_numbers[3], type: 'story', is_valuable: false },

    // 4 סדרות מידע (2 יקרות, 2 זולות)
    { name: 'info_' + shuffled_numbers[4], type: 'info', is_valuable: true },
    { name: 'info_' + shuffled_numbers[5], type: 'info', is_valuable: true },
    { name: 'info_' + shuffled_numbers[6], type: 'info', is_valuable: false },
    { name: 'info_' + shuffled_numbers[7], type: 'info', is_valuable: false }
];

function getImagePath(prefix, i, version = 'b') {
    return `images_story_vs_info_2/${prefix}_${i}${i===6 ? '_'+version : ''}.png`;
}

// 1. Preload
timeline.push({ type: jsPsychPreload, auto_preload: true });

// 2. פתיחה והסכמה מדעת
timeline.push({
    type: jsPsychInstructions,
    pages: [
        '<div class="instruction-text"><h2>Welcome!</h2>' +
        '<p>Thank you for participating in this study. By clicking "Next", you will see the informed consent agreement.</p></div>',
        '<div style="text-align:center; font-family:Arial; font-size: 18px; padding: 20px;">' +
        '<p>Please read the consent form carefully before proceeding.</p>' +
        '<img src="consent_form_2022.png" style="max-width:80%; border:1px solid #000;"></img></div>'
    ],
    show_clickable_nav: true
});

timeline.push({ type: jsPsychFullscreen, fullscreen_mode: true });

// ---------------------------------------------------------
// Part 1: Observation Phase (Full English Version)
// ---------------------------------------------------------

timeline.push({
    type: jsPsychInstructions,
    pages: [
        `<div class="instruction-text"><h2>Part 1: Observation Phase</h2>
        <p>In this first part, you will be shown different sequences of events.</p>
        <p>Before each sequence starts, a colored screen will appear to notify you that a new series is starting.</p>
        <p>Your Task: Watch the images carefully and answer the question appearing after each image.</p>
        <p>Important: Please pay close attention. Making too many errors on these questions will lead to disqualification from the study.</p>
        <p>Click Next to begin Part 1.</p></div>`
    ],
    show_clickable_nav: true
});

// Observation Phase Logic
var observation_order = jsPsych.randomization.shuffle(all_blocks);

observation_order.forEach(function(block) {
    var label = "New series starting"; 
    var cssClass = block.type === 'story' ? 'bg-story' : 'bg-info';

    timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `<div class="transition-square ${cssClass}"><div style="text-align: center;">${label}</div></div>`,
        choices: "NO_KEYS", 
        trial_duration: 2000 
    });

    for (var i = 1; i <= 5; i++) {
        var path = getImagePath(block.name, i);

        timeline.push({
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `<div class="stimulus-container"><img src="${path}" class="exp-image"></div>`,
            choices: "NO_KEYS", 
            trial_duration: 3000 
        });

        var qText = "Is this image related to the previous image?";
        var qChoices;
        
        if (i === 1) {
            qChoices = ['Yes', 'No', 'There was no previous image in this sequence'];
        } else {
            qChoices = ['Yes', 'No'];
        }

        timeline.push({
            type: jsPsychHtmlButtonResponse,
            stimulus: `
                <div class="stimulus-container">
                    <img src="${path}" class="exp-image">
                    <div class="question-area">
                        <p style="font-size: 20px; font-weight: bold;">${qText}</p>
                    </div>
                </div>`,
            choices: qChoices,
            data: { 
                task: 'observation', 
                block_type: block.type, 
                img_idx: i,
                block_id: block.name 
            }
        });
    }
});

// ---------------------------------------------------------
// Part 2: Value Discovery (Updated)
// ---------------------------------------------------------
// ---------------------------------------------------------
// Part 2: Value Discovery (Updated with 5-Second Delay)
// ---------------------------------------------------------
timeline.push({
    type: jsPsychInstructions,
    pages: [
        `<div class="instruction-text"><h2>Part 2: Value Discovery</h2>
        <p>In this part, you will see the <b>last image</b> of each sequence again, followed by the <b>outcome image</b> that comes after it.</p>
        <p>For each image, you will find out how much money it is worth.</p>
        <p><b>Please note:</b> You will be able to click "Next" only after 5 seconds.</p>
        <p>Try to remember which images lead to which values.</p>
        <p>Click "Next" to continue.</p></div>`
    ],
    show_clickable_nav: true
});

all_blocks.forEach(function(block) {
    var path5 = getImagePath(block.name, 5);
    var path6 = getImagePath(block.name, 6, block.is_valuable ? 'a' : 'b');
    var val_text = block.is_valuable ? "$100" : "$0";
    var val_class = block.is_valuable ? "val-high" : "val-low";

    // תמונה אחרונה בסדרה (תמונה 5) - עם השהיה של 5 שניות
    timeline.push({
        type: jsPsychHtmlButtonResponse,
        stimulus: `
            <div class="stimulus-container">
                <p style="font-family:Arial; font-size:20px;">Last image of the sequence...</p>
                <img src="${path5}" class="exp-image">
            </div>`,
        choices: ['Click to see the outcome image'],
        on_load: function() {
            var btn = document.querySelector('.jspsych-btn');
            btn.disabled = true; 
            btn.style.opacity = "0.5";
            setTimeout(() => { 
                btn.disabled = false; 
                btn.style.opacity = "1";
            }, 5000);
        }
    });

    // תמונת התוצאה (תמונה 6) והערך הכספי - עם השהיה של 5 שניות
    timeline.push({
        type: jsPsychHtmlButtonResponse,
        stimulus: `
            <div class="stimulus-container">
                <p style="font-family:Arial; font-size:20px;">Outcome image</p>
                <img src="${path6}" class="exp-image">
                <div class="value-tag ${val_class}">Worth: ${val_text}</div>
            </div>`,
        choices: ['Next'],
        on_load: function() {
            var btn = document.querySelector('.jspsych-btn');
            btn.disabled = true; 
            btn.style.opacity = "0.5";
            setTimeout(() => { 
                btn.disabled = false; 
                btn.style.opacity = "1";
            }, 5000);
        },
        data: {
            task: 'value_learning',
            block_id: block.name,
            value: block.is_valuable ? 100 : 0
        }
    });
});
// ---------------------------------------------------------
// Part 3: Final Choice (Updated with Profit Focus)
// ---------------------------------------------------------
timeline.push({
    type: jsPsychInstructions,
    pages: [
        `<div class="instruction-text"><h2>Part 3: Final Choice</h2>
        <p>This is the final part. You will see pairs of images.</p>
        <p><b>Your Task:</b> Choose the image that you think will lead to a financial profit.</p>
        <p>Correct choices will earn you a bonus reward.</p></div>`
    ],
    show_clickable_nav: true
});

var choice_trials = [];

[1, 2, 3, 4, 5, 6].forEach(idx => {
    // 1. Story vs Story
    choice_trials.push({ 
        img1: getImagePath(all_blocks[0].name, idx), 
        img2: getImagePath(all_blocks[2].name, idx), 
        pair_type: 'story_vs_story',
        idx: idx
    });
    // 2. Info vs Info
    choice_trials.push({ 
        img1: getImagePath(all_blocks[4].name, idx), 
        img2: getImagePath(all_blocks[6].name, idx), 
        pair_type: 'info_vs_info',
        idx: idx
    });
    // 3. Story vs Info Cross
    choice_trials.push({ 
        img1: getImagePath(all_blocks[1].name, idx), 
        img2: getImagePath(all_blocks[7].name, idx), 
        pair_type: 'story_vs_info_cross',
        idx: idx
    });
    // 4. Info vs Story Cross
    choice_trials.push({ 
        img1: getImagePath(all_blocks[5].name, idx), 
        img2: getImagePath(all_blocks[3].name, idx), 
        pair_type: 'info_vs_story_cross',
        idx: idx
    });
});

jsPsych.randomization.shuffle(choice_trials).forEach(function(t) {
    var left_first = Math.random() < 0.5;
    
    timeline.push({
        type: jsPsychHtmlButtonResponse,
        stimulus: `
            <div style="font-family: Arial; margin-bottom: 20px;"><h3>Which image will lead to a <b>financial profit</b>?</h3></div>
            <div class="stimulus-container" style="display: flex; flex-direction: row; width: 800px; justify-content: center; gap: 30px;">
                <img src="${left_first ? t.img1 : t.img2}" class="small-image">
                <img src="${left_first ? t.img2 : t.img1}" class="small-image">
            </div>`,
        choices: ['Left', 'Right'],
        data: { 
            task: 'final_choice',
            img_index: t.idx,
            pair_type: t.pair_type,
            correct_side: left_first ? 'Left' : 'Right'
        }
    });
});

// ---------------------------------------------------------
// Final Questionnaire
// ---------------------------------------------------------
timeline.push({
    type: jsPsychSurveyText,
    questions: [
        {
            prompt: "Did you notice any pattern or rule that helped you predict which images would lead to a financial profit? Please explain.", 
            name: 'general_strategy', 
            required: true,
            rows: 5
        },
        {
            prompt: "In your opinion, was there a connection between how the images in a sequence related to one another and the final financial value? Please explain.",
            name: 'connection_logic',
            required: true,
            rows: 5
        },
        {
            prompt: "Were there specific images that you felt were more 'telling' or provided more information about the upcoming profit than others?",
            name: 'specific_cues',
            required: true,
            rows: 5
        }
    ]
});

jsPsych.run(timeline);

  </script>
</html>
