<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <style>
      body { background-color: #f8f8f8; }
      .exp-image { width: 500px; height: 400px; object-fit: contain; border: 2px solid #ccc; display: block; margin: 0 auto; background-color: white; }
      .stimulus-container { width: 800px; margin: 0 auto; text-align: center; }
      .question-area { height: 120px; display: flex; align-items: center; justify-content: center; }
      .small-image { width: 350px; height: 280px; object-fit: contain; border: 2px solid #ccc; background-color: white; }
      .transition-square { 
          width: 300px; height: 300px; margin: 0 auto; 
          display: flex; align-items: center; justify-content: center;
          font-family: Arial; font-size: 32px; font-weight: bold; border-radius: 15px;
          text-align: center;
      }
      .bg-story { background-color: #ffcccb; color: #8b0000; border: 4px solid #8b0000; } 
      .bg-info { background-color: #add8e6; color: #00008b; border: 4px solid #00008b; }  
      .value-tag { font-size: 32px; font-weight: bold; margin-top: 20px; font-family: Arial; }
      .val-high { color: green; }
      .val-low { color: #666; }
      .instruction-text { font-family: Arial; text-align: left; padding: 50px; line-height: 1.6; font-size: 19px; max-width: 850px; margin: 0 auto; }
      .jspsych-btn { margin: 10px; padding: 10px 20px; font-size: 18px; }
    </style>
    <title>Story vs Facts Experiment</title>
    <script src="jspsych/plugins/jspsych.js"></script>
    <script src="jspsych/plugins/plugin-instructions.js"></script>
    <script src="jspsych/plugins/plugin-html-button-response.js"></script>
    <script src="jspsych/plugins/plugin-survey-text.js"></script>
    <script src="jspsych/plugins/plugin-html-keyboard-response.js"></script>
    <script src="jspsych/plugins/plugin-fullscreen.js"></script>
    <script src="jspsych/plugins/plugin-preload.js"></script>
    <link rel="stylesheet" href="jspsych/css/jspsych.css">
  </head>
  <body></body>
  <script>

// הגדרת קוד השלמה קבוע
const completion_code = 202499; 

var jsPsych = initJsPsych({
    on_finish: function() {
        saveData(jsPsych.data.get().csv());
    }
});

// הוספת הקוד והגדרות קבועות לנתונים
jsPsych.data.addProperties({
    completion_code: completion_code
});

function saveData(data) {
    fetch('write_data.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filedata: data })
    })
    .catch(error => console.error("Error saving data:", error));
}

// מניעת יציאה בטעות
window.onbeforeunload = function() {
    return "Are you sure you want to leave? Your progress will be lost.";
};

var timeline = [];

// --- הגדרת סדרות (8 סדרות סה"כ) ---
var all_numbers = [1, 2, 3, 4, 5, 6, 7, 8];
var shuffled_numbers = jsPsych.randomization.shuffle(all_numbers);

var all_blocks = [
    { name: 'story_' + shuffled_numbers[0], type: 'story', is_valuable: true }, 
    { name: 'story_' + shuffled_numbers[1], type: 'story', is_valuable: true },
    { name: 'story_' + shuffled_numbers[2], type: 'story', is_valuable: false },
    { name: 'story_' + shuffled_numbers[3], type: 'story', is_valuable: false },
    { name: 'info_' + shuffled_numbers[4], type: 'info', is_valuable: true },
    { name: 'info_' + shuffled_numbers[5], type: 'info', is_valuable: true },
    { name: 'info_' + shuffled_numbers[6], type: 'info', is_valuable: false },
    { name: 'info_' + shuffled_numbers[7], type: 'info', is_valuable: false }
];

function getImagePath(prefix, i, version = 'b') {
    return `images_story_vs_info_2/${prefix}_${i}${i===6 ? '_'+version : ''}.png`;
}

// 1. Preload
timeline.push({ type: jsPsychPreload, auto_preload: true });

// 2. פתיחה והסכמה מדעת
timeline.push({
    type: jsPsychInstructions,
    pages: [
        '<div class="instruction-text"><h2>Welcome!</h2>' +
        '<p>Thank you for participating in this study. By clicking "Next", you will see the informed consent agreement.</p></div>',
        '<div style="text-align:center; font-family:Arial; font-size: 18px; padding: 20px;">' +
        '<p>Please read the consent form carefully before proceeding.</p>' +
        '<img src="consent_form_2022.png" style="max-width:80%; border:1px solid #000;"></img></div>'
    ],
    show_clickable_nav: true
});

timeline.push({ type: jsPsychFullscreen, fullscreen_mode: true });

// ---------------------------------------------------------
// Part 1: Observation Phase
// ---------------------------------------------------------
timeline.push({
    type: jsPsychInstructions,
    pages: [
        `<div class="instruction-text"><h2>Part 1: Observation Phase</h2>
        <p>In this first part, you will be shown different sequences of events.</p>
        <p>Before each sequence starts, a colored screen will appear to notify you that a new series is starting.</p>
        <p><b>Your Task:</b> Watch the images carefully and answer the question appearing after each image.</p>
        <p>Important: Please pay close attention. Making too many errors on these questions will lead to disqualification from the study.</p>
        <p>Please note: You will be able to click Next only after 10 seconds.</p></div>`
    ],
    show_clickable_nav: true,
    on_load: function() {
        var btn = document.querySelector('#jspsych-instructions-next');
        btn.disabled = true;
        btn.style.opacity = "0.5";
        setTimeout(function() {
            btn.disabled = false;
            btn.style.opacity = "1";
        }, 10000);
    }
});

var observation_order = jsPsych.randomization.shuffle(all_blocks);

observation_order.forEach(function(block) {
    timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `<div class="transition-square ${block.type === 'story' ? 'bg-story' : 'bg-info'}">New series starting</div>`,
        choices: "NO_KEYS", 
        trial_duration: 2000 
    });

    for (var i = 1; i <= 5; i++) {
        var path = getImagePath(block.name, i);
        timeline.push({
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `<div class="stimulus-container"><img src="${path}" class="exp-image"></div>`,
            choices: "NO_KEYS", 
            trial_duration: 3000 
        });

        timeline.push({
            type: jsPsychHtmlButtonResponse,
            stimulus: `
                <div class="stimulus-container">
                    <img src="${path}" class="exp-image">
                    <div class="question-area">
                        <p style="font-size: 20px; font-weight: bold;">Is this image related to the previous image?</p>
                    </div>
                </div>`,
            choices: i === 1 ? ['Yes', 'No', 'There was no previous image in this sequence'] : ['Yes', 'No'],
            data: { task: 'observation', block_type: block.type, img_idx: i, block_id: block.name }
        });
    }
});

// ---------------------------------------------------------
// Part 2: Value Discovery
// ---------------------------------------------------------
timeline.push({
    type: jsPsychInstructions,
    pages: [
        `<div class="instruction-text"><h2>Part 2: Value Discovery</h2>
        <p>In this part, you will see the <b>last image</b> of each sequence again, followed by the <b>outcome image</b> that comes after it.</p>
        <p>For each image, you will find out how much money it is worth.</p>
        <p><b>Please note:</b> You will be able to click "Next" only after 5 seconds.</p>
        <p>Try to remember which images lead to which values.</p>
        <p>Click "Next" to continue.</p></div>`
    ],
    show_clickable_nav: true
});

all_blocks.forEach(function(block) {
    var path5 = getImagePath(block.name, 5);
    var path6 = getImagePath(block.name, 6, block.is_valuable ? 'a' : 'b');
    var val_text = block.is_valuable ? "$100" : "$0";
    var val_class = block.is_valuable ? "val-high" : "val-low";

    timeline.push({
        type: jsPsychHtmlButtonResponse,
        stimulus: `<div class="stimulus-container"><p style="font-family:Arial; font-size:20px;">Last image of the sequence...</p><img src="${path5}" class="exp-image"></div>`,
        choices: ['Click to see the outcome image'],
        on_load: function() {
            var btn = document.querySelector('.jspsych-btn');
            btn.disabled = true; btn.style.opacity = "0.5";
            setTimeout(() => { btn.disabled = false; btn.style.opacity = "1"; }, 5000);
        }
    });

    timeline.push({
        type: jsPsychHtmlButtonResponse,
        stimulus: `<div class="stimulus-container">
                    <p style="font-family:Arial; font-size:20px;">Outcome image</p>
                    <img src="${path6}" class="exp-image">
                    <div class="value-tag ${val_class}">Worth: ${val_text}</div>
                </div>`,
        choices: ['Next'],
        on_load: function() {
            var btn = document.querySelector('.jspsych-btn');
            btn.disabled = true; btn.style.opacity = "0.5";
            setTimeout(() => { btn.disabled = false; btn.style.opacity = "1"; }, 5000);
        },
        data: { task: 'value_learning', block_id: block.name, value: block.is_valuable ? 100 : 0 }
    });
});

// ---------------------------------------------------------
// Part 3: Final Comparison (24 Trials)
// ---------------------------------------------------------
timeline.push({
    type: jsPsychInstructions,
    pages: [
        `<div class="instruction-text"><h2>Part 3: Final Comparison</h2>
        <p>In this final part, you will be shown pairs of images that you have encountered before.</p>
        <p>Please choose the image that you find more <b>significant or preferable</b> based on your experience.</p>
        <p>There are 24 pairs in total.</p></div>`
    ],
    show_clickable_nav: true
});

var s_val = all_blocks.find(b => b.type === 'story' && b.is_valuable);
var s_low = all_blocks.find(b => b.type === 'story' && !b.is_valuable);
var i_val = all_blocks.find(b => b.type === 'info' && b.is_valuable);
var i_low = all_blocks.find(b => b.type === 'info' && !b.is_valuable);

var choice_trials = [];
for (let repeat = 0; repeat < 2; repeat++) {
    [1, 2, 3, 4, 5].forEach(idx => {
        choice_trials.push({ img1: getImagePath(s_val.name, idx), img2: getImagePath(i_val.name, idx), type: 'val_s_vs_i', val: 100 });
        choice_trials.push({ img1: getImagePath(s_low.name, idx), img2: getImagePath(i_low.name, idx), type: 'low_s_vs_i', val: 0 });
    });
}
[1, 2].forEach(idx => {
    choice_trials.push({ img1: getImagePath(s_val.name, idx), img2: getImagePath(i_val.name, idx), type: 'val_s_vs_i', val: 100 });
    choice_trials.push({ img1: getImagePath(s_low.name, idx), img2: getImagePath(i_low.name, idx), type: 'low_s_vs_i', val: 0 });
});

jsPsych.randomization.shuffle(choice_trials).forEach(function(t) {
    var left_first = Math.random() < 0.5;
    timeline.push({
        type: jsPsychHtmlButtonResponse,
        stimulus: `<div class="stimulus-container"><h3>Which image do you find more significant or preferable?</h3>
                   <div style="display:flex; justify-content:center; gap:40px; margin-top:30px;">
                   <img src="${left_first ? t.img1 : t.img2}" class="small-image">
                   <img src="${left_first ? t.img2 : t.img1}" class="small-image">
                   </div></div>`,
        choices: ['Left Image', 'Right Image'],
        data: { task: 'final_choice', pair_type: t.type, trial_value: t.val },
        on_finish: function(data) {
            data.chosen_type = (data.response === 0) ? (left_first ? 'story' : 'info') : (left_first ? 'info' : 'story');
        }
    });
});

// ---------------------------------------------------------
// Part 4: Questionnaire
// ---------------------------------------------------------
timeline.push({
    type: jsPsychSurveyText,
    questions: [
        { prompt: "Did you notice any pattern or rule that helped you predict which images would lead to a financial profit? Please explain.", name: 'strategy', required: true, rows: 5 },
        { prompt: "In your opinion, was there a connection between how the images in a sequence related to one another and the final financial value? Please explain.", name: 'logic', required: true, rows: 5 },
        { prompt: "Were there specific images that you felt were more 'telling' or provided more information than others?", name: 'cues', required: true, rows: 5 }
    ]
});

// ---------------------------------------------------------
// Part 5: Final & Code
// ---------------------------------------------------------
timeline.push({
    type: jsPsychInstructions,
    pages: [
        `<div class="instruction-text" style="text-align: center;">
            <h2>Task Completed</h2>
            <p>Thank you for your participation!</p>
            <div style="border: 3px dashed #333; padding: 25px; display: inline-block; margin: 30px 0; background: #fff;">
                <span style="font-size: 24px;">Your Completion Code:</span><br>
                <span style="font-size: 40px; color: #8b0000; font-weight: bold;">${completion_code}</span>
            </div>
            <p>Please click <b>"Finish"</b> to save your data and exit.</p>
        </div>`
    ],
    show_clickable_nav: true,
    button_label_next: "Finish",
    on_finish: function() {
        window.onbeforeunload = null;
        document.body.innerHTML = '<div style="text-align:center; margin-top:150px; font-family:Arial;"><h1>Data Saved. Thank you!</h1><p>You can now close this tab.</p></div>';
    }
});

jsPsych.run(timeline);

  </script>
</html>
