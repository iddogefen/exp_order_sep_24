<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Ordering Experiment</title>

    <!-- jsPsych 6 (same version as the original order experiment) -->
    <script src="jspsych/jspsych.js"></script>
    <script src="jspsych/plugins/jspsych-fullscreen.js"></script>
    <script src="jspsych/plugins/jspsych-instructions.js"></script>
    <script src="jspsych/plugins/jspsych-survey-text.js"></script>

    <!-- Custom ordering plugin (same file as in the original experiment) -->
    <script src="jspsych-order.js"></script>

    <!-- Provides saveData(filename, csv), as in the causality experiment.
         Change the path if Functions.js sits elsewhere (the first experiment used "Functions.js"). -->
    <script src="Tools/Functions.js"></script>

    <link rel="stylesheet" href="jspsych/css/jspsych.css">
  </head>
  <body></body>

  <script>
    /* ------------------------------------------------------------------
       1. General settings
       ------------------------------------------------------------------ */
    var CODE_VERSION = 'ordering-v2, 2026-09-29';
    var DATA_FOLDER  = 'data/';                        // same as the causality experiment
    var IMAGE_BASE   = 'https://test12345.live/images/'; // base URL used by the order plugin
    var N_IMAGES     = 10;
    var BUTTON_LABEL = 'Continue when done';

    function urlVar(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    // Same URL variables as the causality experiment (participantId, assignmentId, projectId)
    var SUBJECT_ID = urlVar('participantId') || urlVar('subject')
                     || jsPsych.randomization.randomID(16).toUpperCase();
    var STUDY_ID   = urlVar('assignmentId');
    var SESSION_ID = urlVar('projectId');
    var CONDITION  = urlVar('condition') || 'conditionB';
    var DEBUG      = urlVar('debug') !== null;         // ?debug=1 shows the raw data at the end

    console.log('jsPsych', jsPsych.version(), '| Code version =', CODE_VERSION, '| subject =', SUBJECT_ID);

    /* ------------------------------------------------------------------
       2. The 24 experimental scenarios
          images: <type>_sequence/<name>_<suffix>/<name>_<suffix>_<i>   (10th image is "ten")
       ------------------------------------------------------------------ */
    var SUFFIX = { causal: 'causal', semantic: 'semantic', schematic: 'scheme' };

    var scenarios = [
      // causal (6)
      { type: 'causal',    name: 'museum' },
      { type: 'causal',    name: 'coin' },
      { type: 'causal',    name: 'saving_a_cat' },
      { type: 'causal',    name: 'package' },
      { type: 'causal',    name: 'the_performance' },
      { type: 'causal',    name: 'dog' },

      // schematic (6)
      { type: 'schematic', name: 'dinner_party' },
      { type: 'schematic', name: 'hotel' },
      { type: 'schematic', name: 'restaurant' },
      { type: 'schematic', name: 'flight' },
      { type: 'schematic', name: 'supermarket' },
      { type: 'schematic', name: 'interview' },

      // semantic (12)
      { type: 'semantic',  name: 'housework' },
      { type: 'semantic',  name: 'self_care_activities' },
      { type: 'semantic',  name: 'exploring_nature' },
      { type: 'semantic',  name: 'market' },
      { type: 'semantic',  name: 'using_technology' },
      { type: 'semantic',  name: 'creative_activities' },
      { type: 'semantic',  name: 'redecorating_a_house' },
      { type: 'semantic',  name: 'cat_care' },
      { type: 'semantic',  name: 'traveling' },
      { type: 'semantic',  name: 'physical_activity' },
      { type: 'semantic',  name: 'kitchen_operations' },
      { type: 'semantic',  name: 'maintaining_a_car' }
    ];

    var PRACTICE_STIMULI = [
      'instructions/movie_1', 'instructions/movie_2',
      'instructions/movie_3', 'instructions/movie_4'
    ];

    function buildStimuli(scenario) {
      var base = scenario.type + '_sequence/' + scenario.name + '_' + SUFFIX[scenario.type];
      var list = [];
      for (var i = 1; i <= N_IMAGES; i++) {
        var num = (i === 10) ? 'ten' : i;
        list.push(base + '/' + scenario.name + '_' + SUFFIX[scenario.type] + '_' + num);
      }
      return list;
    }

    /* ------------------------------------------------------------------
       3. Progress indicator ("Trial 5 of 24") shown while a trial is on screen.
          Attached to <body> (not the jsPsych display element) so the plugin cannot wipe it.
       ------------------------------------------------------------------ */
    function showProgress(text) {
      hideProgress();
      var div = document.createElement('div');
      div.id = 'trial-progress';
      div.textContent = text;
      div.style.cssText = 'position:fixed;top:6px;left:50%;transform:translateX(-50%);' +
                          'font:16px sans-serif;color:#555;background:rgba(255,255,255,0.85);' +
                          'padding:2px 10px;border-radius:4px;pointer-events:none;z-index:1000;';
      document.body.appendChild(div);
    }
    function hideProgress() {
      var old = document.getElementById('trial-progress');
      if (old) old.remove();
    }

    function buildOrderTrial(scenario, index, total) {
      return {
        type: 'order',
        stimuli: buildStimuli(scenario),
        button_label: BUTTON_LABEL,
        data: {
          sequence_type: scenario.type,
          scenario: scenario.name,
          trial_number: index + 1
        },
        on_load: function () { showProgress('Trial ' + (index + 1) + ' of ' + total); },
        on_finish: function () { hideProgress(); }
      };
    }

    /* ------------------------------------------------------------------
       4. Timeline
       ------------------------------------------------------------------ */
    var timeline = [];

    timeline.push({ type: 'fullscreen', fullscreen_mode: true });

    timeline.push({
      type: 'instructions',
      pages: [
        '<h2>Welcome</h2><p>Thank you for participating in this study.</p>',
        '<p>In each trial you will see 10 pictures that describe a sequence of events, ' +
        'presented in a scrambled order.</p>',
        '<p>Your task is to <b>drag the pictures</b> into the slots so that they appear ' +
        'in the correct order, from first to last.</p>',
        '<p>When you are done, click <b>"' + BUTTON_LABEL + '"</b>.</p>',
        '<p>First you will complete a short practice trial.</p>'
      ],
      show_clickable_nav: true,
      button_label_next: 'Next',
      button_label_previous: 'Back'
    });

    // Practice trial (4 pictures)
    timeline.push({
      type: 'order',
      stimuli: PRACTICE_STIMULI,
      button_label: BUTTON_LABEL,
      data: { sequence_type: 'practice', scenario: 'movie', trial_number: 0 }
    });

    timeline.push({
      type: 'instructions',
      pages: [
        '<p>The practice is over.</p>' +
        '<p>Now you will complete <b>' + scenarios.length + '</b> trials, each with 10 pictures.</p>' +
        '<p>Take your time and try to be as accurate as you can.</p>'
      ],
      show_clickable_nav: true,
      button_label_next: 'Start'
    });

    // The 24 experimental trials, in a random order for each participant
    var shuffled = jsPsych.randomization.shuffle(scenarios);
    shuffled.forEach(function (scenario, i) {
      timeline.push(buildOrderTrial(scenario, i, shuffled.length));
    });

    // Demographics
    timeline.push({
      type: 'survey-text',
      questions: [{ prompt: 'What is your age?', required: true }]
    });
    timeline.push({
      type: 'survey-text',
      questions: [{ prompt: 'What is your gender?', required: true }]
    });

    // Final screen
    timeline.push({
      type: 'instructions',
      pages: [
        '<h2>Thank you for participating!</h2>' +
        '<p>You have completed the experiment.</p>' +
        '<p>Click "Finish" to save your responses. Please wait until this page confirms that saving is done.</p>'
      ],
      show_clickable_nav: true,
      button_label_next: 'Finish'
    });

    /* ------------------------------------------------------------------
       5. Saving
          Like the causality experiment: saveData(DATA_FOLDER + subject + ".csv", csv).
          If saveData is not available (Functions.js not loaded), fall back to a local download.
       ------------------------------------------------------------------ */
    function saveResults() {
      var csv = jsPsych.data.get().csv();
      var filename = DATA_FOLDER + SUBJECT_ID + '.csv';
      try {
        if (typeof saveData === 'function') {
          saveData(filename, csv);
          console.log('Saved', filename);
          return 'server';
        }
        console.warn('saveData() not found - downloading the file locally instead');
      } catch (e) {
        console.error('saveData() failed - downloading the file locally instead', e);
      }
      jsPsych.data.get().localSave('csv', SUBJECT_ID + '.csv');
      return 'local';
    }

    /* ------------------------------------------------------------------
       6. Run
       ------------------------------------------------------------------ */
    jsPsych.data.addProperties({
      subject: SUBJECT_ID,
      condition: CONDITION,
      study_id: STUDY_ID,
      session_id: SESSION_ID,
      code_version: CODE_VERSION
    });

    // Preload all images so the slots never appear empty mid-trial
    var images_to_preload = [];
    scenarios.forEach(function (s) {
      buildStimuli(s).forEach(function (st) { images_to_preload.push(IMAGE_BASE + st + '.png'); });
    });
    PRACTICE_STIMULI.forEach(function (st) { images_to_preload.push(IMAGE_BASE + st + '.png'); });
    for (var b = 5; b <= 10; b++) { images_to_preload.push(IMAGE_BASE + 'blank' + b + '.jpg'); }

    jsPsych.init({
      timeline: timeline,
      preload_images: images_to_preload,
      show_preload_progress_bar: true,
      on_finish: function () {
        var where = saveResults();
        var el = jsPsych.getDisplayElement();
        el.innerHTML = '<h2>Thank you!</h2>' +
          '<p>Your responses were saved' + (where === 'local' ? ' (downloaded to your computer).' : '.') +
          ' You may close this window.</p>';
        if (DEBUG) { jsPsych.data.displayData(); }
      }
    });
  </script>
</html>
