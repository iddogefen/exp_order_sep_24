<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Preference by Association Experiment (Wimmer & Shohamy, 2012)</title>
    <style>
      body {
          background-color: #f8f9fa;
          font-family: Arial, sans-serif;
      }

      .stimulus-container {
          width: 800px;
          margin: 0 auto;
          text-align: center;
      }

      .exp-image {
          width: 450px;
          height: 350px;
          object-fit: contain;
          border: 2px solid #ccc;
          background-color: #fff;
          display: block;
          margin: 0 auto;
      }

      .small-image {
          width: 320px;
          height: 250px;
          object-fit: contain;
          border: 2px solid #ccc;
          background-color: #fff;
      }

      .fixation {
          font-size: 60px;
          color: #333;
          height: 400px;
          display: flex;
          align-items: center;
          justify-content: center;
      }

      .question-area {
          height: 80px;
          display: flex;
          align-items: center;
          justify-content: center;
      }
    </style>
    <script src="jspsych/plugins/jspsych.js"></script>
    <script src="jspsych/plugins/plugin-instructions.js"></script>
    <script src="jspsych/plugins/plugin-html-button-response.js"></script>
    <script src="jspsych/plugins/plugin-survey-text.js"></script>
    <script src="jspsych/plugins/plugin-html-keyboard-response.js"></script>
    <script src="jspsych/plugins/plugin-fullscreen.js"></script>
    <script src="jspsych/plugins/plugin-preload.js"></script>
    <link rel="stylesheet" href="jspsych/css/jspsych.css">
  </head>
  <body></body>
  <script>

// ============================================================
// DATA SAVING
// ============================================================
function saveData(data) {
    fetch('write_data.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filedata: data })
    })
    .then(response => response.json())
    .then(result => console.log("Data saved successfully:", result.file))
    .catch(error => console.error("Error saving data:", error));
}

var jsPsych = initJsPsych({
    on_finish: function() {
        saveData(jsPsych.data.get().csv());
    }
});

var timeline = [];

var participant_id = jsPsych.data.getURLVariable('participantId') || jsPsych.randomization.randomID(15);
var study_id = jsPsych.data.getURLVariable('assignmentId');
var session_id = jsPsych.data.getURLVariable('projectId');

jsPsych.data.addProperties({
    subject_id: participant_id,
    study_id: study_id,
    session_id: session_id,
    experiment: 'Wimmer_Shohamy_2012_Association_Bias'
});


// ============================================================
// STIMULI & PAIR DEFINITIONS (S1 -> S2 Pairs)
// ============================================================
// במאמר הקלאסי, S1 מוצג תחילה ואחריו S2.
// בדיקת התפשטות הערך נעשית על S1 בחלק 3.
var all_pairs = [
    { name: 'coin_causal',           type: 'causal_sequence',    s1_index: 1, s2_index: 2 },
    { name: 'dog_causal',            type: 'causal_sequence',    s1_index: 1, s2_index: 2 },
    { name: 'dinner_party_scheme',   type: 'schematic_sequence', s1_index: 1, s2_index: 2 },
    { name: 'housework_semantic',    type: 'semantic_sequence',  s1_index: 1, s2_index: 2 }
];

// בחירת 4 זוגות אקראיים (ניתן להגדיל במידת הצורך)
var test_blocks = jsPsych.randomization.shuffle(all_pairs).slice(0, 4);

// חלוקת הזוגות ל-Reward (High Value) ו-Neutral
var half_size = Math.floor(test_blocks.length / 2);
var rewarded_blocks = test_blocks.slice(0, half_size).map(b => b.name);

function getImagePath(block, idx) {
    var suffix = (idx === 10) ? "ten" : idx;
    return `images/${block.type}/${block.name}/${block.name}_${suffix}.png`;
}


// ============================================================
// PRELOAD
// ============================================================
var imagesToPreload = [
    'consent_form_2022.png',
    'images/gray.png',
    'images/dollar.png'
];

test_blocks.forEach(function(b) {
    imagesToPreload.push(getImagePath(b, b.s1_index));
    imagesToPreload.push(getImagePath(b, b.s2_index));
});

timeline.push({
    type: jsPsychPreload,
    images: imagesToPreload,
    message: 'Loading task assets...'
});


// ============================================================
// INSTRUCTIONS & CONSENT
// ============================================================
timeline.push({
    type: jsPsychInstructions,
    pages: [
        '<div style="text-align: left; padding: 40px; font-family: Arial;">' +
        '<h2>Welcome to the Experiment</h2>' +
        '<p>This study investigates memory mechanisms and decision-making.</p>' +
        '<p>Click "Next" to read the consent form.</p>' +
        '</div>',
        '<div style="text-align: center; padding: 20px;">' +
        '<img src="consent_form_2022.png" style="max-width:80%;"></img>' +
        '</div>'
    ],
    show_clickable_nav: true
});

timeline.push({
    type: jsPsychFullscreen,
    fullscreen_mode: true
});


// ============================================================
// PHASE 1: ASSOCIATIVE LEARNING (S1 -> S2 Pairs)
// ============================================================
timeline.push({
    type: jsPsychInstructions,
    pages: [
        '<div style="text-align: center; padding: 40px; font-family: Arial;">' +
        '<h2>Phase 1: Associative Pair Presentation</h2>' +
        '<p>You will view pairs of consecutive images (First Image -> Second Image).</p>' +
        '<p>Pay close attention to the sequential relationship between the images in each pair.</p>' +
        '</div>'
    ],
    show_clickable_nav: true
});

// הצגת כל זוג S1 -> S2
test_blocks.forEach(function(b) {
    var s1_path = getImagePath(b, b.s1_index);
    var s2_path = getImagePath(b, b.s2_index);

    // S1 Presentation
    timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `<div class="stimulus-container"><img src="${s1_path}" class="exp-image"></div>`,
        choices: "NO_KEYS",
        trial_duration: 3000,
        data: { task: 'phase1_S1', folder: b.name }
    });

    // Fixation Cross (ISI)
    timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<div class="fixation">+</div>',
        choices: "NO_KEYS",
        trial_duration: 1000
    });

    // S2 Presentation
    timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `<div class="stimulus-container"><img src="${s2_path}" class="exp-image"></div>`,
        choices: "NO_KEYS",
        trial_duration: 3000,
        data: { task: 'phase1_S2', folder: b.name }
    });

    // Attention Question
    timeline.push({
        type: jsPsychHtmlButtonResponse,
        stimulus: `
            <div class="stimulus-container">
                <img src="${s2_path}" class="exp-image">
                <div class="question-area">
                    <p style="font-size: 20px; font-weight: bold;">Was there a person in either of the images?</p>
                </div>
            </div>`,
        choices: ['Yes', 'No'],
        trial_duration: 3000,
        data: { task: 'phase1_attention_check', folder: b.name }
    });

    // Inter-Trial Interval (ITI)
    timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<div style="background-color: white; width: 100vw; height: 100vh;"></div>',
        choices: "NO_KEYS",
        trial_duration: 1500
    });
});


// ============================================================
// PHASE 2: VALUE CONDITIONING (Rewarding S2)
// ============================================================
timeline.push({
    type: jsPsychInstructions,
    pages: [
        '<div style="text-align: center; padding: 40px; font-family: Arial;">' +
        '<h2>Phase 2: Value Conditioning</h2>' +
        '<p>In this phase, specific images will be associated with monetary value.</p>' +
        '<p><span style="color:green; font-weight:bold;">DOLLAR</span> = High Value ($)</p>' +
        '<p><span style="color:gray; font-weight:bold;">GRAY</span> = Neutral Value</p>' +
        '</div>'
    ],
    show_clickable_nav: true
});

test_blocks.forEach(function(b) {
    var is_rewarded = rewarded_blocks.includes(b.name);
    var s2_path = getImagePath(b, b.s2_index); // התגמול ניתן על S2

    var reward_img = is_rewarded ? 'images/dollar.png' : 'images/gray.png';
    var reward_txt = is_rewarded ? 'WORTH MONEY' : 'NEUTRAL VALUE';
    var reward_clr = is_rewarded ? 'green' : 'gray';

    timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `
            <div class="stimulus-container" style="display: flex; align-items: center; justify-content: center; gap: 30px;">
                <img src="${s2_path}" class="exp-image">
                <div>
                    <img src="${reward_img}" style="width: 140px; height: 140px; border: 4px solid ${reward_clr};">
                    <p style="color: ${reward_clr}; font-weight: bold; font-size: 24px;">${reward_txt}</p>
                </div>
            </div>`,
        choices: "NO_KEYS",
        trial_duration: 5000,
        data: {
            task: 'phase2_value_conditioning',
            folder: b.name,
            reward_condition: is_rewarded ? 'rewarded' : 'neutral'
        }
    });

    timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<div style="background-color: white; width: 100vw; height: 100vh;"></div>',
        choices: "NO_KEYS",
        trial_duration: 1500
    });
});


// ============================================================
// PHASE 3: PREFERENCE / CHOICE TEST (Testing S1 Items)
// ============================================================
timeline.push({
    type: jsPsychInstructions,
    pages: [
        '<div style="text-align: center; padding: 40px; font-family: Arial;">' +
        '<h2>Phase 3: Decision Test</h2>' +
        '<p>You will now see pairs of images side-by-side.</p>' +
        '<p>Choose the image that you feel is worth <b>more money</b> or that you prefer.</p>' +
        '</div>'
    ],
    show_clickable_nav: true
});

// יצירת צמדי בחירה בין פריטי S1 (S1_Rewarded vs. S1_Neutral)
var rewarded_s1_blocks = test_blocks.filter(b => rewarded_blocks.includes(b.name));
var neutral_s1_blocks  = test_blocks.filter(b => !rewarded_blocks.includes(b.name));

rewarded_s1_blocks.forEach(function(r_block, idx) {
    var n_block = neutral_s1_blocks[idx];
    if (!n_block) return;

    var r_s1_path = getImagePath(r_block, r_block.s1_index);
    var n_s1_path = getImagePath(n_block, n_block.s1_index);

    timeline.push({
        type: jsPsychHtmlButtonResponse,
        stimulus: function() {
            var left_is_rewarded = Math.random() < 0.5;
            window.current_choice = {
                left_is_rewarded: left_is_rewarded,
                r_folder: r_block.name,
                n_folder: n_block.name
            };

            var left_img  = left_is_rewarded ? r_s1_path : n_s1_path;
            var right_img = left_is_rewarded ? n_s1_path : r_s1_path;

            return `
                <div style="font-family: Arial; margin-bottom: 20px;">
                    <h3>Which image is worth <b>more money</b>?</h3>
                </div>
                <div class="stimulus-container" style="display: flex; justify-content: center; gap: 30px;">
                    <img src="${left_img}" class="small-image">
                    <img src="${right_img}" class="small-image">
                </div>`;
        },
        choices: ['Left', 'Right'],
        on_finish: function(data) {
            var c = window.current_choice;
            data.task = 'phase3_s1_preference_test';
            data.rewarded_folder = c.r_folder;
            data.neutral_folder = c.n_folder;
            data.chose_associated_reward = ((data.response === 0 && c.left_is_rewarded) ||
                                            (data.response === 1 && !c.left_is_rewarded)) ? 1 : 0;
        }
    });
});


// ============================================================
// DEMOGRAPHICS & DEBRIEF
// ============================================================
timeline.push({
    type: jsPsychSurveyText,
    questions: [
        { prompt: 'Gender (MALE / FEMALE / OTHER):', name: 'gender', rows: 1, columns: 20 },
        { prompt: 'Age:', name: 'age', rows: 1, columns: 5 },
        { prompt: 'How did you choose between images in the final part?', name: 'strategy', rows: 2, columns: 50 }
    ],
    data: { task: 'demographics' }
});

jsPsych.run(timeline);

  </script>
</html>
