<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Quick Test - Single Pair</title>
    <style>
      body {
          background-color: #f8f9fa;
          font-family: Arial, sans-serif;
      }

      .stimulus-container {
          width: 800px;
          margin: 0 auto;
          text-align: center;
      }

      .exp-image {
          width: 450px;
          height: 350px;
          object-fit: contain;
          border: 2px solid #ccc;
          background-color: #fff;
          display: block;
          margin: 0 auto;
      }

      .small-image {
          width: 320px;
          height: 250px;
          object-fit: contain;
          border: 2px solid #ccc;
          background-color: #fff;
      }

      .fixation {
          font-size: 60px;
          color: #333;
          height: 400px;
          display: flex;
          align-items: center;
          justify-content: center;
      }

      .question-area {
          height: 80px;
          display: flex;
          align-items: center;
          justify-content: center;
      }
    </style>
    <script src="jspsych/plugins/jspsych.js"></script>
    <script src="jspsych/plugins/plugin-instructions.js"></script>
    <script src="jspsych/plugins/plugin-html-button-response.js"></script>
    <script src="jspsych/plugins/plugin-survey-text.js"></script>
    <script src="jspsych/plugins/plugin-html-keyboard-response.js"></script>
    <script src="jspsych/plugins/plugin-fullscreen.js"></script>
    <script src="jspsych/plugins/plugin-preload.js"></script>
    <link rel="stylesheet" href="jspsych/css/jspsych.css">
  </head>
  <body></body>
  <script>

// ============================================================
// DATA SAVING (Fixed with Backup)
// ============================================================
var data_folder = 'data/';

function saveData(data) {
    console.log("Starting saveData function");
    fetch('write_data.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filedata: data })
    })
    .then(response => {
        if (!response.ok) {
            throw new Error('Network response was not ok: ' + response.status);
        }
        return response.text().then(text => {
            try {
                return JSON.parse(text);
            } catch (e) {
                return { success: true, raw: text };
            }
        });
    })
    .then(result => {
        console.log("Success! Data saved to server.", result);
    })
    .catch(error => {
        console.error("Error saving data to server:", error);
        // Save locally as backup if server fails
        try {
            var backupKey = 'experiment_backup_' + participant_id + '_' + Date.now();
            localStorage.setItem(backupKey, data);
            console.log("Data saved locally to localStorage with key:", backupKey);
            alert("✓ Data saved locally. Key: " + backupKey);
        } catch (storageError) {
            console.error("Error saving to localStorage:", storageError);
            alert("Warning: Could not save data to server or locally. Please do not close this window and contact support.");
        }
    });
}

var jsPsych = initJsPsych({
    on_finish: function() {
        console.log("Experiment finished, saving data...");
        saveData(jsPsych.data.get().csv());
    }
});

var timeline = [];

var participant_id = jsPsych.data.getURLVariable('participantId') || jsPsych.randomization.randomID(15);
var study_id = jsPsych.data.getURLVariable('assignmentId');
var session_id = jsPsych.data.getURLVariable('projectId');

jsPsych.data.addProperties({
    subject_id: participant_id,
    study_id: study_id,
    session_id: session_id,
    experiment: 'Quick_Test_Single_Pair'
});

// ============================================================
// SINGLE TEST PAIR
// ============================================================
var test_pair = { 
    name: 'museum_causal', 
    type: 'causal_sequence', 
    s1_index: 1, 
    s2_index: 2,
    order_direction: 'ascending',
    causality_condition: 'high'
};

function getImagePath(idx) {
    var suffix = (idx === 10) ? "ten" : idx;
    return `images/${test_pair.type}/${test_pair.name}/${test_pair.name}_${suffix}.png`;
}

// ============================================================
// PRELOAD
// ============================================================
var imagesToPreload = [
    'images/gray.png',
    'images/dollar.png',
    getImagePath(test_pair.s1_index),
    getImagePath(test_pair.s2_index)
];

timeline.push({
    type: jsPsychPreload,
    images: imagesToPreload,
    message: 'Loading images...'
});

// ============================================================
// INSTRUCTIONS
// ============================================================
timeline.push({
    type: jsPsychInstructions,
    pages: [
        '<div style="text-align: left; padding: 40px; font-family: Arial;">' +
        '<h2>Quick Test - Single Pair</h2>' +
        '<p>This is a minimal version with only 1 image pair to quickly test data saving.</p>' +
        '<p>Click "Next" to start.</p>' +
        '</div>'
    ],
    show_clickable_nav: true
});

// ============================================================
// PHASE 1: VIEW IMAGES
// ============================================================
timeline.push({
    type: jsPsychInstructions,
    pages: [
        '<div style="text-align: left; padding: 40px; font-family: Arial;">' +
        '<h2>Phase 1: View Images</h2>' +
        '<p>Looking at 1 image pair...</p>' +
        '</div>'
    ],
    show_clickable_nav: true
});

var s1_path = getImagePath(test_pair.s1_index);
var s2_path = getImagePath(test_pair.s2_index);

timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `<div class="stimulus-container"><img src="${s1_path}" class="exp-image"></div>`,
    choices: "NO_KEYS",
    trial_duration: 2000,
    data: { 
        task: 'phase1_S1', 
        folder: test_pair.name, 
        order_direction: test_pair.order_direction,
        causality_condition: test_pair.causality_condition
    }
});

timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: '<div class="fixation">+</div>',
    choices: "NO_KEYS",
    trial_duration: 1000
});

timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `<div class="stimulus-container"><img src="${s2_path}" class="exp-image"></div>`,
    choices: "NO_KEYS",
    trial_duration: 2000,
    data: { 
        task: 'phase1_S2', 
        folder: test_pair.name
    }
});

// ============================================================
// PHASE 2: VALUE CONDITIONING
// ============================================================
timeline.push({
    type: jsPsychInstructions,
    pages: [
        '<div style="text-align: left; padding: 40px; font-family: Arial;">' +
        '<h2>Phase 2: Value Association</h2>' +
        '<p>Press SPACEBAR to reveal the value...</p>' +
        '</div>'
    ],
    show_clickable_nav: true
});

timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
        <div class="stimulus-container">
            <img src="${s2_path}" class="exp-image">
            <p style="font-size: 24px; margin-top: 30px; font-weight: bold;">Press SPACEBAR</p>
        </div>`,
    choices: [' '], 
    data: { task: 'phase2_wait_for_value' }
});

timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
        <div class="stimulus-container" style="display: flex; align-items: center; justify-content: center; gap: 30px;">
            <img src="${s2_path}" class="exp-image">
            <div>
                <img src="images/dollar.png" style="width: 140px; height: 140px; border: 4px solid green;">
                <p style="color: green; font-weight: bold; font-size: 24px;">WORTH MONEY ($)</p>
            </div>
        </div>`,
    choices: "NO_KEYS",
    trial_duration: 3000,
    data: {
        task: 'phase2_value_conditioning',
        reward_condition: 'rewarded'
    }
});

// ============================================================
// PHASE 3: CHOICE TEST
// ============================================================
timeline.push({
    type: jsPsychInstructions,
    pages: [
        '<div style="text-align: left; padding: 40px; font-family: Arial;">' +
        '<h2>Phase 3: Choose</h2>' +
        '<p>Pick which image you prefer...</p>' +
        '</div>'
    ],
    show_clickable_nav: true
});

timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
        <div style="font-family: Arial; margin-bottom: 20px;">
            <h3>Which image do you prefer?</h3>
        </div>
        <div class="stimulus-container" style="display: flex; justify-content: center; gap: 30px;">
            <img src="${s1_path}" class="small-image">
            <img src="${s2_path}" class="small-image">
        </div>`,
    choices: "NO_KEYS",
    trial_duration: 3000
});

timeline.push({
    type: jsPsychHtmlButtonResponse,
    stimulus: `
        <div style="font-family: Arial; margin-bottom: 20px;">
            <h3>Which image do you prefer?</h3>
        </div>
        <div class="stimulus-container" style="display: flex; justify-content: center; gap: 30px;">
            <img src="${s1_path}" class="small-image">
            <img src="${s2_path}" class="small-image">
        </div>`,
    choices: ['Left', 'Right'],
    on_finish: function(data) {
        data.task = 'phase3_preference_test';
        data.choice = data.response === 0 ? 'Left' : 'Right';
    }
});

// ============================================================
// DEMOGRAPHICS
// ============================================================
timeline.push({
    type: jsPsychSurveyText,
    questions: [
        { prompt: 'Your name:', name: 'name', rows: 1, columns: 20 },
        { prompt: 'Age:', name: 'age', rows: 1, columns: 5 }
    ],
    data: { task: 'demographics' }
});

// ============================================================
// END
// ============================================================
timeline.push({
    type: jsPsychInstructions,
    pages: [
        '<div style="text-align: center; padding: 60px; font-family: Arial;">' +
        '<h2>✓ Test Complete!</h2>' +
        '<p style="font-size: 20px; margin-top: 20px;">Check the browser console (F12) or localStorage to verify data was saved.</p>' +
        '<p style="font-size: 16px; color: #666; margin-top: 40px;">You can now close this window.</p>' +
        '</div>'
    ],
    show_clickable_nav: false
});

jsPsych.run(timeline);

  </script>
</html>
