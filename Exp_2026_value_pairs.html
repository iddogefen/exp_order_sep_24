<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Quick Test - Single Pair</title>
    <style>
      body {
          background-color: #f8f9fa;
          font-family: Arial, sans-serif;
      }

      .stimulus-container {
          width: 800px;
          margin: 0 auto;
          text-align: center;
      }

      .exp-image {
          width: 450px;
          height: 350px;
          object-fit: contain;
          border: 2px solid #ccc;
          background-color: #fff;
          display: block;
          margin: 0 auto;
      }

      .small-image {
          width: 320px;
          height: 250px;
          object-fit: contain;
          border: 2px solid #ccc;
          background-color: #fff;
      }

      .fixation {
          font-size: 60px;
          color: #333;
          height: 400px;
          display: flex;
          align-items: center;
          justify-content: center;
      }
    </style>
    <script src="jspsych/plugins/jspsych.js"></script>
    <script src="jspsych/plugins/plugin-instructions.js"></script>
    <script src="jspsych/plugins/plugin-html-button-response.js"></script>
    <script src="jspsych/plugins/plugin-survey-text.js"></script>
    <script src="jspsych/plugins/plugin-html-keyboard-response.js"></script>
    <script src="jspsych/plugins/plugin-fullscreen.js"></script>
    <script src="jspsych/plugins/plugin-preload.js"></script>
    <link rel="stylesheet" href="jspsych/css/jspsych.css">
  </head>
  <body></body>
  <script>

// ============================================================
// DATA SAVING (Using save-my-data.php)
// ============================================================
function saveData(data) {
    console.log("Starting saveData...");
    fetch('/save-my-data.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
            filedata: data
        })
    })
    .then(response => response.json())
    .then(result => {
        console.log("✓ Success! Data saved.", result);
    })
    .catch(error => {
        console.error("✗ Error saving data:", error);
    });
}

var jsPsych = initJsPsych({
    on_finish: function() {
        console.log("Experiment finished, saving data...");
        saveData(jsPsych.data.get().csv());
    }
});

var timeline = [];

var participant_id = jsPsych.data.getURLVariable('participantId') || jsPsych.randomization.randomID(15);

jsPsych.data.addProperties({
    subject_id: participant_id,
    experiment: 'Quick_Test'
});

// ============================================================
// SINGLE TEST PAIR
// ============================================================
var test_pair = { 
    name: 'museum_causal', 
    type: 'causal_sequence', 
    s1_index: 1, 
    s2_index: 2
};

function getImagePath(idx) {
    var suffix = (idx === 10) ? "ten" : idx;
    return `images/${test_pair.type}/${test_pair.name}/${test_pair.name}_${suffix}.png`;
}

// ============================================================
// PRELOAD
// ============================================================
var imagesToPreload = [
    'images/gray.png',
    'images/dollar.png',
    getImagePath(test_pair.s1_index),
    getImagePath(test_pair.s2_index)
];

timeline.push({
    type: jsPsychPreload,
    images: imagesToPreload,
    message: 'Loading images...'
});

// ============================================================
// START
// ============================================================
timeline.push({
    type: jsPsychInstructions,
    pages: [
        '<div style="text-align: center; padding: 40px; font-family: Arial;">' +
        '<h2>Quick Test</h2>' +
        '<p>This is a quick 2-minute test to verify data saving works.</p>' +
        '<p>Click Next to begin.</p>' +
        '</div>'
    ],
    show_clickable_nav: true
});

// ============================================================
// VIEW IMAGES
// ============================================================
var s1_path = getImagePath(test_pair.s1_index);
var s2_path = getImagePath(test_pair.s2_index);

timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `<div class="stimulus-container"><img src="${s1_path}" class="exp-image"></div>`,
    choices: "NO_KEYS",
    trial_duration: 2000,
    data: { task: 'view_image_1' }
});

timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: '<div class="fixation">+</div>',
    choices: "NO_KEYS",
    trial_duration: 1000
});

timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `<div class="stimulus-container"><img src="${s2_path}" class="exp-image"></div>`,
    choices: "NO_KEYS",
    trial_duration: 2000,
    data: { task: 'view_image_2' }
});

// ============================================================
// VALUE REVEAL
// ============================================================
timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
        <div class="stimulus-container">
            <img src="${s2_path}" class="exp-image">
            <p style="font-size: 24px; margin-top: 30px;">Press SPACEBAR</p>
        </div>`,
    choices: [' '], 
    data: { task: 'wait_for_value' }
});

timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
        <div class="stimulus-container" style="display: flex; align-items: center; justify-content: center; gap: 30px;">
            <img src="${s2_path}" class="exp-image">
            <div>
                <img src="images/dollar.png" style="width: 140px; height: 140px; border: 4px solid green;">
                <p style="color: green; font-weight: bold; font-size: 24px;">WORTH MONEY ($)</p>
            </div>
        </div>`,
    choices: "NO_KEYS",
    trial_duration: 3000,
    data: { task: 'value_revealed' }
});

// ============================================================
// CHOICE
// ============================================================
timeline.push({
    type: jsPsychHtmlButtonResponse,
    stimulus: `
        <div style="font-family: Arial; margin-bottom: 20px;">
            <h3>Which image do you prefer?</h3>
        </div>
        <div class="stimulus-container" style="display: flex; justify-content: center; gap: 30px;">
            <img src="${s1_path}" class="small-image">
            <img src="${s2_path}" class="small-image">
        </div>`,
    choices: ['Left', 'Right'],
    data: { task: 'preference_choice' }
});

// ============================================================
// DEMOGRAPHICS
// ============================================================
timeline.push({
    type: jsPsychSurveyText,
    questions: [
        { prompt: 'Your name:', name: 'name', rows: 1, columns: 20 },
        { prompt: 'Your age:', name: 'age', rows: 1, columns: 5 }
    ],
    data: { task: 'demographics' }
});

// ============================================================
// END
// ============================================================
timeline.push({
    type: jsPsychInstructions,
    pages: [
        '<div style="text-align: center; padding: 60px; font-family: Arial;">' +
        '<h2>✓ Test Complete!</h2>' +
        '<p style="font-size: 20px; margin-top: 20px;">Check Console (F12) for "✓ Success!" message.</p>' +
        '<p style="font-size: 16px; margin-top: 20px;">Data should be saved in: <br><b>data/exp_data_*.csv</b></p>' +
        '</div>'
    ],
    show_clickable_nav: false
});

jsPsych.run(timeline);

  </script>
</html>
