// ============================================================
// DATA SAVING
// ============================================================
var data_folder = 'data/';

function saveData(data) {
    fetch('write_data.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filedata: data })
    })
    .then(response => {
        if (!response.ok) {
            throw new Error('Network response was not ok: ' + response.status);
        }
        return response.json();
    })
    .then(result => {
        console.log("Success! File saved as: ", result.file);
    })
    .catch(error => {
        console.error("Error saving data:", error);
        alert("There was an error saving your data. Please do not close this window.");
    });
}

var jsPsych = initJsPsych({
    on_finish: function() {
        saveData(jsPsych.data.get().csv());
    }
});

// ============================================================
// CONFIGURATION PARAMETERS - Modify general settings here
// ============================================================
var N_IMAGES_PER_SEQUENCE = 10;      // Number of images per sequence directory

var PAIR_DISTANCES = [1, 2, 3];      // Pair distances (e.g., 2->3 is distance 1, 4->7 is distance 3)

// false = Each sequence gets 1 pair per distance; direction (ascending/descending) is balanced across sequences.
//         Total: 3 pairs per sequence => 54 pairs in experiment.
// true  = Each sequence gets both ascending and descending pairs for every distance.
//         Total: 6 pairs per sequence => 108 pairs (significantly longer experiment).
var BOTH_DIRECTIONS_PER_SEQUENCE = false;

// 'after_each' = Attention question appears after each image individually (like the original version).

// SEQUENCE DEFINITIONS AND REWARDED CATEGORY SELECTION
// ============================================================

var schematic_folders = [
    'dinner_party_scheme', 'flight_scheme', 'hotel_scheme',

var semantic_folders = [

var n_semantic = 6;

var sampled_semantic  = jsPsych.randomization.sampleWithoutReplacement(semantic_folders, Math.min(n_semantic, semantic_folders.length));

var valuable_causal    = jsPsych.randomization.sampleWithoutReplacement(sampled_causal, n_valuable_per_type);
var valuable_schematic = jsPsych.randomization.sampleWithoutReplacement(sampled_schematic, n_valuable_per_type);
var valuable_semantic  = jsPsych.randomization.sampleWithoutReplacement(sampled_semantic, n_valuable_per_type);

// HELPER FUNCTIONS FOR IMAGE PATHS

function imageSuffix(idx) {
    return (idx === 10) ? "ten" : idx;
}

function imagePath(block, idx) {
    return `images/${block.type}/${block.name}/${block.name}_${imageSuffix(idx)}.png`;
}

function generateSelectedPaths(selectedBlocks) {
    var paths = [];
    selectedBlocks.forEach(function(block) {
        for (var i = 1; i <= N_IMAGES_PER_SEQUENCE; i++) {
            paths.push(imagePath(block, i));
        }
    });
    return paths;
}

// ============================================================
// PAIR PLAN GENERATION
// Each pair = two images from the same sequence, shown sequentially.
// forward  = ascending order  (e.g., 2 then 3, or 4 then 7) -> positive signed_distance
// backward = descending order (e.g., 3 then 2, or 7 then 4) -> negative signed_distance
// ============================================================
function makePairsAtDistance(dist, dirs) {
    // All possible anchors such that both images remain within 1..N
    var anchor_options = [];
    for (var i = 1; i + dist <= N_IMAGES_PER_SEQUENCE; i++) {
        anchor_options.push(i);
    }
    // Select a distinct anchor per direction to avoid showing the exact same image pair twice
    var anchors = jsPsych.randomization.sampleWithoutReplacement(anchor_options, dirs.length);

    return dirs.map(function(dir, k) {
        var low  = anchors[k];
        var high = anchors[k] + dist;
        return {
            first:     (dir === 'forward') ? low  : high,
            second:    (dir === 'forward') ? high : low,
            distance:  dist,
            direction: dir
        };
    });
}

function buildPairPlan(blocks) {
    var plan = {};
    blocks.forEach(function(b) { plan[b.name] = []; });

    PAIR_DISTANCES.forEach(function(dist) {
        if (BOTH_DIRECTIONS_PER_SEQUENCE) {
            // For each sequence: generate both ascending and descending pairs at this distance
            blocks.forEach(function(b) {
                plan[b.name] = plan[b.name].concat(makePairsAtDistance(dist, ['forward', 'backward']));
            });
        } else {
            // Balanced across sequences: half get ascending, half get descending at this distance
            var half = Math.floor(blocks.length / 2);
            var dir_list = Array(half).fill('forward').concat(Array(blocks.length - half).fill('backward'));
            dir_list = jsPsych.randomization.shuffle(dir_list);
            blocks.forEach(function(b, idx) {
                plan[b.name] = plan[b.name].concat(makePairsAtDistance(dist, [dir_list[idx]]));
            });
        }
    });

    // Shuffle pair order within each sequence
    blocks.forEach(function(b) {
        plan[b.name] = jsPsych.randomization.shuffle(plan[b.name]);
    });

    return plan;
}

var pair_plan = buildPairPlan(experimental_blocks);

// Debug log: all pairs to be presented to this participant

// ============================================================
// BUILDER FUNCTIONS FOR PAIR TRIAL SCREENS

function viewTrial(image_src, trial_data) {
    return {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `
            <div class="stimulus-container">
                <img src="${image_src}" class="exp-image">
                <div class="question-area"></div>
            </div>`,
        choices: "NO_KEYS",
        trial_duration: IMG_DURATION,
        data: trial_data
    };
}

function questionTrial(image_src, question_text, trial_data) {

        trial_duration: QUESTION_DURATION,
        response_ends_trial: true,
        data: trial_data

}

        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<div style="background-color: white; width: 100vw; height: 100vh;"></div>',
        choices: "NO_KEYS",
        trial_duration: BLOCK_BREAK,
        data: { task: 'block_break', folder: block.name }

            sequence_type: block.type,

            pair_number_in_sequence: p_index + 1,
            first_image_index: pair.first,

            distance: pair.distance,                                 // Always positive (1/2/3)
            signed_distance: pair.second - pair.first,               // Positive = ascending, Negative = descending
            order_direction: pair.direction,                         // 'forward' / 'backward'
            order_sign: (pair.direction === 'forward') ? 1 : -1,      // 1 / -1
            is_ascending: (pair.second > pair.first) ? 1 : 0,         // 1 = ascending, 0 = descending
            pair_label: pair.first + '->' + pair.second              // e.g., "4->7" or "7->4"
        };

        var img_first  = imagePath(block, pair.first);
        var img_second = imagePath(block, pair.second);

        if (QUESTION_MODE === 'after_each') {
            timeline.push(viewTrial(img_first, Object.assign({}, pair_info, {
                task: 'part1_pair_view', position_in_pair: 1, image_index: pair.first

            })));

                task: 'part1_pair_view', position_in_pair: 1, image_index: pair.first
            })));
            timeline.push(fixation_trial);
            timeline.push(viewTrial(img_second, Object.assign({}, pair_info, {

// --- 3a. Within-sequence neighbor comparisons at distances 1/2/3 from the target image ---
experimental_blocks.forEach(function(block) {
    var offsets = [1, 2, 3];

    offsets.forEach(function(dist) {
        var neighbors_sequence = {
            timeline: [
                {
                    type: jsPsychHtmlKeyboardResponse,
                    stimulus: function() {
                        var part2_info = jsPsych.data.get().filter({folder: block.name, task: 'part2_value_learning'}).values()[0];
                        var X = (part2_info) ? part2_info.valuable_image_index : 5;

                        var left_idx  = Math.random() < 0.5 ? X - dist : X + dist;
                        var right_idx = (left_idx === X - dist) ? X + dist : X - dist;

                        window.data_for_current_block = {
                            left: left_idx,
                            right: right_idx,
                            lucky_X: X,
                            distance: dist,
                            left_path: imagePath(block, left_idx),
                            right_path: imagePath(block, right_idx)
                        };

                        return `
                            <div style="font-family: Arial; margin-bottom: 20px;"><h3>Which image is worth <b>more money</b>?</h3></div>

                                <img src="${window.data_for_current_block.left_path}" class="small-image">
                                <img src="${window.data_for_current_block.right_path}" class="small-image">
                            </div>`;
                    },
                    choices: "NO_KEYS",
                    trial_duration: 3000
                },
                {
                    type: jsPsychHtmlButtonResponse,
                    stimulus: function() {
                        return `
                            <div style="font-family: Arial; margin-bottom: 20px;"><h3>Which image is worth <b>more money</b>?</h3></div>
                            <div class="stimulus-container" style="display: flex; width: 800px; justify-content: center; gap: 30px;">
                                <img src="${window.data_for_current_block.left_path}" class="small-image">
                                <img src="${window.data_for_current_block.right_path}" class="small-image">
                            </div>`;
                    },
                    choices: ['Left', 'Right'],
                    on_finish: function(data) {
                        data.task = 'part3_choice_neighbors';
                        data.folder = block.name;
                        data.sequence_type = block.type;
                        data.distance_from_x = window.data_for_current_block.distance;
                        data.target_X = window.data_for_current_block.lucky_X;

                        var chosen_idx = (data.response === 0) ? window.data_for_current_block.left : window.data_for_current_block.right;
                        data.chosen_image_index = chosen_idx;

                        // Check if selected image was after the target image (ascending) or before (descending)
                        data.is_x_plus_dist = (chosen_idx === (data.target_X + data.distance_from_x)) ? 1 : 0;
                        data.chosen_direction = (chosen_idx > data.target_X) ? 'ascending' : 'descending';
                    }
                }
            ]
        };
        all_part3_trials.push(neighbors_sequence);
    });
});

// --- 3b. Between-sequence comparisons: Valuable vs. Neutral ---
var valuable_blocks_list_info = experimental_blocks.filter(b => valuable_folders_list.includes(b.name));
var neutral_blocks_list_info  = experimental_blocks.filter(b => !valuable_folders_list.includes(b.name));

valuable_blocks_list_info.forEach(function(v_block, index) {
    var n_block = neutral_blocks_list_info[index];
    if (!n_block) return;

    var cross_sequence = {
        timeline: [
            {
                type: jsPsychHtmlKeyboardResponse,
                stimulus: function() {
                    var v_info = jsPsych.data.get().filter({folder: v_block.name, task: 'part2_value_learning'}).values()[0];
                    var v_X = (v_info) ? v_info.valuable_image_index : 5;
                    var n_info = jsPsych.data.get().filter({folder: n_block.name, task: 'part2_value_learning'}).values()[0];
                    var n_X = (n_info) ? n_info.valuable_image_index : 5;

                    var left_is_v = Math.random() < 0.5;

                    window.cross_comp_data = {
                        left_is_v: left_is_v,
                        v_folder: v_block.name, n_folder: n_block.name,
                        v_index: v_X, n_index: n_X,
                        v_type: v_block.type, n_type: n_block.type,
                        v_path: imagePath(v_block, v_X),
                        n_path: imagePath(n_block, n_X)
                    };

                    return `<div style="font-family: Arial; margin-bottom: 20px;"><h3>Which image is worth <b>more money</b>?</h3></div>
                            <div class="stimulus-container" style="display: flex; width: 800px; justify-content: center; gap: 30px;">
                                <img src="${left_is_v ? window.cross_comp_data.v_path : window.cross_comp_data.n_path}" class="small-image">
                                <img src="${left_is_v ? window.cross_comp_data.n_path : window.cross_comp_data.v_path}" class="small-image">
                            </div>`;
                },
                choices: "NO_KEYS",
                trial_duration: 3000
            },
            {
                type: jsPsychHtmlButtonResponse,
                stimulus: function() {
                    var c = window.cross_comp_data;
                    return `<div style="font-family: Arial; margin-bottom: 20px;"><h3>Which image is worth <b>more money</b>?</h3></div>
                            <div class="stimulus-container" style="display: flex; width: 800px; justify-content: center; gap: 30px;">
                                <img src="${c.left_is_v ? c.v_path : c.n_path}" class="small-image">
                                <img src="${c.left_is_v ? c.n_path : c.v_path}" class="small-image">
                            </div>`;
                },
                choices: ['Left', 'Right'],
                on_finish: function(data) {
                    var c = window.cross_comp_data;
                    data.task = 'part3_valuable_vs_neutral_direct';
                    data.valuable_folder = c.v_folder;
                    data.neutral_folder = c.n_folder;
                    data.valuable_image_index = c.v_index;
                    data.neutral_image_index = c.n_index;
                    data.correct_choice = ((data.response === 0 && c.left_is_v) ||
                                           (data.response === 1 && !c.left_is_v)) ? 1 : 0;
                }
            }
        ]
    };
    all_part3_trials.push(cross_sequence);
});

// Final randomization across all Part 3 trial types
jsPsych.randomization.shuffle(all_part3_trials).forEach(function(trial) {
    timeline.push(trial);
});


// ============================================================
// DEMOGRAPHICS & DEBRIEF
// ============================================================
var trial_demographics = {
    type: jsPsychSurveyText,
    questions: [
        {prompt: 'Please insert your gender (MALE / FEMALE / OTHER)', name: 'gender', rows: 1, columns: 20},
        {prompt: 'Please insert your age', name: 'age', rows: 1, columns: 5},
        {prompt: 'In the last part, how did you decide which image was worth <b>more money</b>?', name: 'decision_strategy', rows: 1, columns: 50},
        {prompt: 'Did you use the same logic for all pairs? Please explain.', name: 'consistency_check', rows: 1, columns: 50},
        {prompt: 'In the first part, did you notice anything about the <b>order</b> in which the two images of each pair appeared?', name: 'order_awareness', rows: 1, columns: 50}
    ],
    data: { task: 'demographics' }
};
timeline.push(trial_demographics);

jsPsych.run(timeline);

  </script>
