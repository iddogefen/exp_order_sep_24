<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Preference by Association - Single Pair Test</title>
    <style>
      body {
          background-color: #f8f9fa;
          font-family: Arial, sans-serif;
      }
      .stimulus-container {
          width: 800px;
          margin: 0 auto;
          text-align: center;
      }
      .exp-image {
          width: 450px;
          height: 350px;
          object-fit: contain;
          border: 2px solid #ccc;
          background-color: #fff;
          display: block;
          margin: 0 auto;
      }
      .small-image {
          width: 320px;
          height: 250px;
          object-fit: contain;
          border: 2px solid #ccc;
          background-color: #fff;
      }
      .fixation {
          font-size: 60px;
          color: #333;
          height: 400px;
          display: flex;
          align-items: center;
          justify-content: center;
      }
      .question-area {
          height: 80px;
          display: flex;
          align-items: center;
          justify-content: center;
      }
    </style>
    <script src="jspsych/plugins/jspsych.js"></script>
    <script src="jspsych/plugins/plugin-instructions.js"></script>
    <script src="jspsych/plugins/plugin-html-button-response.js"></script>
    <script src="jspsych/plugins/plugin-survey-text.js"></script>
    <script src="jspsych/plugins/plugin-html-keyboard-response.js"></script>
    <script src="jspsych/plugins/plugin-fullscreen.js"></script>
    <script src="jspsych/plugins/plugin-preload.js"></script>
    <link rel="stylesheet" href="jspsych/css/jspsych.css">
  </head>
  <body></body>
  <script>

// ============================================================
// DATA SAVING
// ============================================================
function saveData(data) {
    fetch('write_data.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filedata: data })
    })
    .then(response => response.json())
    .then(result => console.log("Data saved successfully:", result.file))
    .catch(error => console.error("Error saving data:", error));
}

var jsPsych = initJsPsych({
    on_finish: function() {
        saveData(jsPsych.data.get().csv());
    }
});

var timeline = [];

var participant_id = jsPsych.data.getURLVariable('participantId') || jsPsych.randomization.randomID(15);
var study_id = jsPsych.data.getURLVariable('assignmentId');
var session_id = jsPsych.data.getURLVariable('projectId');

jsPsych.data.addProperties({
    subject_id: participant_id,
    study_id: study_id,
    session_id: session_id,
    experiment: 'Single_Pair_Saving_Test'
});

// ============================================================
// SINGLE PAIR TEST DEFINITION
// ============================================================
var test_blocks = [
    { id: 0, name: 'museum_causal', type: 'causal_sequence', s1_index: 6, s2_index: 9, order_direction: 'ascending', causality_condition: 'high' }
];

var rewarded_blocks = [0];

function getImagePath(block, idx) {
    var suffix = (idx === 10) ? "ten" : idx;
    return `images/${block.type}/${block.name}/${block.name}_${suffix}.png`;
}

// ============================================================
// PRELOAD
// ============================================================
var imagesToPreload = [
    'consent_form_2022.png',
    'images/gray.png',
    'images/dollar.png',
    getImagePath(test_blocks[0], test_blocks[0].s1_index),
    getImagePath(test_blocks[0], test_blocks[0].s2_index)
];

timeline.push({
    type: jsPsychPreload,
    images: imagesToPreload,
    message: 'Loading test assets...'
});

// ============================================================
// INSTRUCTIONS & CONSENT
// ============================================================
timeline.push({
    type: jsPsychInstructions,
    pages: [
        '<div style="text-align: left; padding: 40px; font-family: Arial;">' +
        '<h2>Test Experiment (1 Pair)</h2>' +
        '<p>This is a quick verification run to test data saving.</p>' +
        '<p>Click "Next" to begin.</p>' +
        '</div>'
    ],
    show_clickable_nav: true
});

timeline.push({
    type: jsPsychFullscreen,
    fullscreen_mode: true
});

// ============================================================
// PHASE 1: IMAGE PAIR
// ============================================================
var b = test_blocks[0];
var s1_path = getImagePath(b, b.s1_index);
var s2_path = getImagePath(b, b.s2_index);

timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `<div class="stimulus-container"><img src="${s1_path}" class="exp-image"></div>`,
    choices: "NO_KEYS",
    trial_duration: 1000,
    data: { task: 'phase1_S1', folder: b.name }
});

timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: '<div class="fixation">+</div>',
    choices: "NO_KEYS",
    trial_duration: 500
});

timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `<div class="stimulus-container"><img src="${s2_path}" class="exp-image"></div>`,
    choices: "NO_KEYS",
    trial_duration: 1000,
    data: { task: 'phase1_S2', folder: b.name }
});

// ============================================================
// PHASE 2: VALUE CONDITIONING
// ============================================================
timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
        <div class="stimulus-container">
            <img src="${s2_path}" class="exp-image">
            <p style="font-size: 24px; margin-top: 30px; font-weight: bold;">Press SPACEBAR to reveal value</p>
        </div>`,
    choices: [' '],
    data: { task: 'phase2_wait_for_value', folder: b.name }
});

timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
        <div class="stimulus-container" style="display: flex; align-items: center; justify-content: center; gap: 30px;">
            <img src="${s2_path}" class="exp-image">
            <div>
                <img src="images/dollar.png" style="width: 140px; height: 140px; border: 4px solid green;">
                <p style="color: green; font-weight: bold; font-size: 24px;">WORTH MONEY ($)</p>
            </div>
        </div>`,
    choices: "NO_KEYS",
    trial_duration: 1500,
    data: { task: 'phase2_value_conditioning', folder: b.name }
});

// ============================================================
// PHASE 3: PREFERENCE TEST (3 seconds view before choice)
// ============================================================
timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: function() {
        return `
            <div style="font-family: Arial; margin-bottom: 20px;">
                <h3>Which image is <b>luckier</b>?</h3>
            </div>
            <div class="stimulus-container" style="display: flex; justify-content: center; gap: 30px;">
                <img src="${s1_path}" class="small-image">
                <img src="${s1_path}" class="small-image">
            </div>`;
    },
    choices: "NO_KEYS",
    trial_duration: 3000
});

timeline.push({
    type: jsPsychHtmlButtonResponse,
    stimulus: function() {
        return `
            <div style="font-family: Arial; margin-bottom: 20px;">
                <h3>Which image is <b>luckier</b>?</h3>
            </div>
            <div class="stimulus-container" style="display: flex; justify-content: center; gap: 30px;">
                <img src="${s1_path}" class="small-image">
                <img src="${s1_path}" class="small-image">
            </div>`;
    },
    choices: ['Left', 'Right'],
    data: { task: 'phase3_s1_preference_test' }
});

// ============================================================
// DEMOGRAPHICS
// ============================================================
timeline.push({
    type: jsPsychSurveyText,
    questions: [
        { prompt: 'Age:', name: 'age', rows: 1, columns: 5 }
    ],
    data: { task: 'demographics' }
});

// ============================================================
// END SCREEN
// ============================================================
timeline.push({
    type: jsPsychInstructions,
    pages: [
        '<div style="text-align: center; padding: 60px; font-family: Arial;">' +
        '<h2>Test Completed</h2>' +
        '<p style="font-size: 22px; color: #28a745; font-weight: bold;">Thank you! Check your server data folder now.</p>' +
        '</div>'
    ],
    show_clickable_nav: false
});

jsPsych.run(timeline);

  </script>
</html>
